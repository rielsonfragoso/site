<script id="lv-data" type="application/json">__DADOS__</script>
<script>
(function(){
  var DATA=JSON.parse(document.getElementById('lv-data').textContent), D=DATA.livros, C=DATA.combos;
  var FG=__FG__*100, FRETE=__FRETE__*100, WA='__WA__', KEY='lv-cart', sel={};
  function c(v){return Math.round(v*100);}
  function brl(cents){var s=(cents/100).toFixed(2).split('.');return 'R$ '+s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+s[1];}
  function $(id){return document.getElementById(id);}
  function cpfOk(v){v=v.replace(/\D/g,'');if(v.length!==11||/^(\d)\1{10}$/.test(v))return false;
    for(var t=9;t<11;t++){var s=0;for(var i=0;i<t;i++)s+=(+v[i])*(t+1-i);if(((s*10)%11)%10!==+v[t])return false;}return true;}
  try{var s=JSON.parse(localStorage.getItem(KEY)||'{}');Object.keys(s).forEach(function(k){if(D[k]&&D[k].q>0)sel[k]=Math.max(1,Math.min(s[k]|0,D[k].q));});}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(sel));}catch(e){}}
  function totals(S){S=S||sel;
    var sub=0,n=0,desc=0,cd=[];
    Object.keys(S).forEach(function(k){sub+=c(D[k].p)*S[k];n+=S[k];});
    C.forEach(function(cb){var sets=Math.min.apply(null,cb.itens.map(function(k){return S[k]||0;}));
      if(sets>0){var soma=cb.itens.reduce(function(s,k){return s+c(D[k].p);},0);var d=(soma-c(cb.p))*sets;desc+=d;cd.push({nome:cb.nome,sets:sets,d:d});}});
    // promoção por quantidade, cumulativa com os combos: 10% a partir de 3 livros, 20% a partir de 10
    var pct=n>=10?20:(n>=3?10:0), dq=Math.round((sub-desc)*pct/100);
    var liq=sub-desc-dq, fr=(n&&liq<FG)?FRETE:0;
    return{sub:sub,desc:desc,cd:cd,pct:pct,dq:dq,liq:liq,fr:fr,tot:liq+fr,n:n};
  }
  function syncButtons(){[].forEach.call(document.querySelectorAll('.add'),function(b){var on=!!sel[b.getAttribute('data-k')];
    b.setAttribute('aria-pressed',on?'true':'false');b.textContent=on?'✓ No pedido':(b.classList.contains('big')?'+ Adicionar ao pedido':'+ Pedido');});}
  function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
  function render(){
    var t=totals(), cart=$('cart');
    cart.classList.toggle('show',t.n>0); document.body.classList.toggle('has-cart',t.n>0);
    var extra=t.liq>=FG?'Frete grátis':'Faltam '+brl(FG-t.liq)+' para o frete grátis';
    if(t.pct)extra+=' · '+t.pct+'% off'; if(t.n&&t.n<3)extra+=' · '+(t.n===2?'mais 1 livro':'mais 2 livros')+' e ganhe 10%'; else if(t.n>=6&&t.n<10)extra+=' · faltam '+(10-t.n)+' para 20%';
    $('csum').innerHTML='<b>'+t.n+(t.n===1?' livro':' livros')+' · '+brl(t.liq)+'</b><small>'+extra+'</small>';
    var ul=$('co-items'); ul.innerHTML='';
    Object.keys(sel).forEach(function(k){
      var d=D[k], li=document.createElement('li');
      var qty=d.q>1?'<span class="qty"><button type="button" data-k="'+k+'" data-d="-1" aria-label="Diminuir">−</button><b>'+sel[k]+'</b><button type="button" data-k="'+k+'" data-d="1" aria-label="Aumentar"'+(sel[k]>=d.q?' disabled':'')+'>+</button></span>':'';
      li.innerHTML='<span class="it"><span>'+esc(d.t)+'</span><small>'+esc(d.a)+' · '+brl(c(d.p))+(sel[k]>1?' cada':'')+'</small></span>'+qty+'<span class="lp">'+brl(c(d.p)*sel[k])+'</span><button type="button" class="rm" data-k="'+k+'" aria-label="Remover">✕</button>';
      ul.appendChild(li);
    });
    $('co-empty').hidden=t.n>0;
    $('co-sub').textContent=brl(t.sub);
    var dl=[]; if(t.desc)dl.push('− '+brl(t.desc)+' ('+t.cd.map(function(x){return x.nome;}).join(', ')+')');
    if(t.dq)dl.push('− '+brl(t.dq)+' ('+t.pct+'% por levar '+t.n+' livros)');
    $('co-dl').hidden=$('co-desc').hidden=!dl.length; $('co-desc').innerHTML=dl.map(esc).join('<br>');
    $('co-fr').textContent=t.n?(t.fr?brl(t.fr):'Grátis'):'–';
    $('co-tot').textContent=brl(t.tot);
    $('co-hint').textContent=t.n&&t.liq<FG?'Adicione mais '+brl(FG-t.liq)+' em livros e o frete sai grátis.':'';
    $('co-bulk').hidden=!t.pct; $('co-bulk').innerHTML=t.pct?'🎉 Promoção: <b>'+t.pct+'% de desconto</b> por levar '+t.n+' livros'+(t.pct===10?' (a partir de 10 livros, 20%)':'')+'.':'';
    syncButtons(); save();
  }
  document.addEventListener('click',function(ev){
    var b=ev.target.closest('.add'); if(b){var k=b.getAttribute('data-k');if(sel[k])delete sel[k];else if(D[k]&&D[k].q>0)sel[k]=1;render();return;}
    var cb=ev.target.closest('.addcombo'); if(cb){var co=C.filter(function(x){return x.id===cb.getAttribute('data-c');})[0];
      co.itens.forEach(function(k){if(D[k].q>0&&!sel[k])sel[k]=1;}); render(); cb.textContent='✓ Combo no pedido'; return;}
  });
  $('co-items').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;var k=b.getAttribute('data-k');
    if(b.classList.contains('rm'))delete sel[k];else{var n=sel[k]+parseInt(b.getAttribute('data-d'),10);if(n<1)delete sel[k];else sel[k]=Math.min(n,D[k].q);}render();});
  $('cclear').addEventListener('click',function(){sel={};render();});
  var panel=$('checkout');
  function openCo(){panel.hidden=false;document.body.classList.add('co-open');$('co-close').focus();}
  function closeCo(){panel.hidden=true;document.body.classList.remove('co-open');}
  $('copen').addEventListener('click',openCo); $('co-close').addEventListener('click',closeCo);
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!panel.hidden)closeCo();});
  // lote inteiro: todos os exemplares disponíveis, pelas condições atuais do site
  var LOTE={}; Object.keys(D).forEach(function(k){if(D[k].q>0)LOTE[k]=D[k].q;});
  var lt=totals(LOTE), lbox=$('lote-box');
  if($('lote-tot')){$('lote-n').textContent=lt.n; $('lote-tot').textContent=brl(lt.tot);
    $('lote-sub').textContent='(em vez de '+brl(lt.sub)+' somando os preços individuais)';}
  if(lbox){
    var lu=$('lote-items');
    Object.keys(LOTE).sort(function(a,b){return D[a].t.localeCompare(D[b].t,'pt');}).forEach(function(k){var d=D[k],li=document.createElement('li');
      li.innerHTML='<span class="it"><span>'+esc(d.t)+'</span><small>'+esc(d.a)+(LOTE[k]>1?' · '+LOTE[k]+' exemplares':'')+'</small></span><span class="lp">'+brl(c(d.p)*LOTE[k])+'</span>';lu.appendChild(li);});
    $('lt-sub').textContent=brl(lt.sub); $('lt-cb').textContent=lt.desc?'− '+brl(lt.desc):'–';
    $('lt-pl').textContent='Promoção '+lt.pct+'% ('+lt.n+' livros)'; $('lt-pq').textContent='− '+brl(lt.dq); $('lt-tot').textContent=brl(lt.tot);
    function openL(){lbox.hidden=false;document.body.classList.add('co-open');$('lote-close').focus();}
    function closeL(){lbox.hidden=true;document.body.classList.remove('co-open');}
    $('lote-open').addEventListener('click',openL); $('lote-close').addEventListener('click',closeL);
    document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!lbox.hidden)closeL();});
    lbox.addEventListener('click',function(ev){if(ev.target===lbox)closeL();});
    $('lote-form').addEventListener('submit',function(ev){ev.preventDefault();
      var f=ev.target,m=$('lote-msg'),bad=null;
      ['nome','cidade','uf'].forEach(function(n){var ok=!!f[n].value.trim();f[n].setAttribute('aria-invalid',ok?'false':'true');if(!ok&&!bad)bad=f[n];});
      if(bad){m.textContent='Preencha nome, cidade e estado.';m.hidden=false;bad.focus();return;} m.hidden=true;
      var of=f.oferta.value.trim(), ov=parseFloat(of.replace(/[^\d,\.]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));
      var L=['*PROPOSTA PELO LOTE INTEIRO · rielsonfragoso.com.br*','',
        'Nome: '+f.nome.value.trim(),'Cidade: '+f.cidade.value.trim()+' / '+f.uf.value.trim().toUpperCase(),'',
        '*Lote:* todos os '+lt.n+' livros disponíveis no site ('+Object.keys(LOTE).length+' títulos)',
        'Soma dos preços individuais: '+brl(lt.sub),
        'Com combos, promoção de '+lt.pct+'% e frete grátis: '+brl(lt.tot),'',
        '*Minha oferta:* '+(isFinite(ov)&&ov>0?brl(Math.round(ov*100)):'quero conversar sobre o valor')];
      if(f.obs.value.trim())L.push('Mensagem: '+f.obs.value.trim());
      L.push('','Gostaria de fazer uma oferta pelo lote inteiro de livros.');
      var url='https://wa.me/'+WA+'?text='+encodeURIComponent(L.join('\n'));
      $('lote-go').href=url; $('lote-done').hidden=false; window.location.href=url;
    });
  }
  // encomenda: livro que a pessoa procura
  var pq=$('pq-form');
  if(pq){
    pq.addEventListener('change',function(ev){if(ev.target.name==='tipo'){var v=ev.target.value;
      $('pq-tl').textContent=v.indexOf('autor')>-1?'Título (se tiver um preferido)':v.indexOf('coleção')>-1?'Coleção e volume(s) *':'Título *';
      $('pq-al').textContent=v.indexOf('autor')>-1?'Autor *':'Autor';}});
    pq.addEventListener('submit',function(ev){ev.preventDefault();
      var f=pq,m=$('pq-msg'),tipo=f.querySelector('input[name=tipo]:checked').value,porAutor=tipo.indexOf('autor')>-1;
      var bad=null;
      [porAutor?f.autor:f.titulo,f.nome].forEach(function(el){var ok=!!el.value.trim();el.setAttribute('aria-invalid',ok?'false':'true');if(!ok&&!bad)bad=el;});
      if(bad){m.textContent=porAutor?'Preencha o autor e o seu nome.':'Preencha o título e o seu nome.';m.hidden=false;bad.focus();return;} m.hidden=true;
      var v=function(n){return f[n].value.trim();};
      var L=['*Procuro um livro · rielsonfragoso.com.br*','','Nome: '+v('nome'),'Tipo de busca: '+tipo];
      if(v('titulo'))L.push((tipo.indexOf('coleção')>-1?'Coleção/volume: ':'Título: ')+v('titulo'));
      if(v('autor'))L.push('Autor: '+v('autor'));
      if(v('edicao'))L.push('Editora/edição/ano: '+v('edicao')+' ('+f.exata.value.toLowerCase()+')');
      if(v('preco'))L.push('Pretendo pagar até: R$ '+v('preco').replace(/^R\$\s*/i,''));
      if(v('obs'))L.push('Detalhes: '+v('obs'));
      L.push('', f.fotos.checked?'Vou enviar fotos da capa/edição em seguida.':'Pode me avisar se encontrar?');
      var url='https://wa.me/'+WA+'?text='+encodeURIComponent(L.join('\n'));
      $('pq-go').href=url; $('pq-done').hidden=false; window.location.href=url;
    });
  }
  // busca e filtros (só no catálogo)
  var q=$('q'), lang=$('lang'), grid=$('todos');
  if(q&&grid){
    var cat='*', fb=[].slice.call(document.querySelectorAll('.filters button')), cards=[].slice.call(grid.querySelectorAll('.book'));
    function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
    function apply(){var term=norm(q.value.trim()), l=lang.value, vis=0;
      cards.forEach(function(cd){var ok=(cat==='*'||cd.getAttribute('data-cat')===cat)&&(l==='*'||cd.getAttribute('data-lang')===l)&&(!term||cd.getAttribute('data-q').indexOf(term)>=0);cd.hidden=!ok;if(ok)vis++;});
      $('none').hidden=vis>0;}
    fb.forEach(function(b){b.addEventListener('click',function(){cat=b.getAttribute('data-f');fb.forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});apply();});});
    q.addEventListener('input',apply); lang.addEventListener('change',apply);
  }
  var f=$('co-form');
  f.addEventListener('input',function(ev){if(ev.target.getAttribute('aria-invalid')==='true'&&ev.target.value.trim())ev.target.setAttribute('aria-invalid','false');});
  f.cpf.addEventListener('input',function(){var v=f.cpf.value.replace(/\D/g,'').slice(0,11);
    f.cpf.value=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/,'.$1-$2');});
  f.cep.addEventListener('input',function(){var v=f.cep.value.replace(/\D/g,'').slice(0,8);f.cep.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v;
    if(v.length===8){fetch('https://viacep.com.br/ws/'+v+'/json/').then(function(r){return r.json();}).then(function(j){if(j.erro)return;
      if(j.logradouro&&!f.rua.value)f.rua.value=j.logradouro; if(j.bairro&&!f.bairro.value)f.bairro.value=j.bairro;
      if(j.localidade&&!f.cidade.value)f.cidade.value=j.localidade; if(j.uf&&!f.uf.value)f.uf.value=j.uf; f.numero.focus();}).catch(function(){});}});
  f.addEventListener('submit',function(ev){
    ev.preventDefault(); var msg=$('co-msg'), t=totals(); msg.hidden=true;
    if(!t.n){msg.textContent='Escolha pelo menos um livro.';msg.hidden=false;return;}
    var req=['nome','cpf','tel','cep','uf','cidade','bairro','rua','numero'], bad=null;
    req.forEach(function(n){var el=f[n],ok=!!el.value.trim();if(n==='cep')ok=el.value.replace(/\D/g,'').length===8;if(n==='tel')ok=el.value.replace(/\D/g,'').length>=10;if(n==='cpf')ok=cpfOk(el.value);
      el.setAttribute('aria-invalid',ok?'false':'true');if(!ok&&!bad)bad=el;});
    if(bad){msg.textContent=bad.name==='cpf'?'Confira o CPF (11 números).':bad.name==='cep'?'Confira o CEP.':(bad.name==='tel'?'Confira o telefone com DDD.':'Preencha os campos obrigatórios.');msg.hidden=false;bad.focus();return;}
    var L=['*Pedido de livros · rielsonfragoso.com.br*','','*Dados do comprador*',
      'Nome: '+f.nome.value.trim(),'CPF: '+f.cpf.value.trim(),'Telefone: '+f.tel.value.trim(),'CEP: '+f.cep.value.trim(),'Estado: '+f.uf.value.trim().toUpperCase(),
      'Cidade: '+f.cidade.value.trim(),'Bairro: '+f.bairro.value.trim(),'Rua: '+f.rua.value.trim(),'Número: '+f.numero.value.trim()];
    if(f.comp.value.trim())L.push('Complemento: '+f.comp.value.trim());
    L.push('','*Produtos*');
    Object.keys(sel).forEach(function(k){var d=D[k];L.push('• '+d.t+' – '+d.a+' | '+sel[k]+' x '+brl(c(d.p))+' = '+brl(c(d.p)*sel[k]));});
    L.push('','*Resumo*','Subtotal dos livros: '+brl(t.sub));
    if(!t.desc&&!t.dq)L.push('Descontos: nenhum');
    if(t.desc)L.push('Desconto de combo: − '+brl(t.desc)+' ('+t.cd.map(function(x){return x.nome+(x.sets>1?' x'+x.sets:'');}).join(', ')+')');
    if(t.dq)L.push('Promoção '+t.pct+'% ('+t.n+' livros): − '+brl(t.dq));
    L.push('Frete: '+(t.fr?brl(t.fr):'grátis'),'*Total: '+brl(t.tot)+'*');
    // pacote: livros deitados e empilhados -> soma das alturas, maior largura, maior comprimento, +0,5 cm em cada medida
    var pa=0,pl=0,pc=0,pg=0,sem=[];
    Object.keys(sel).forEach(function(k){var d=D[k],q=sel[k];
      if(d.m){pa+=d.m[0]*q;pl=Math.max(pl,d.m[1]);pc=Math.max(pc,d.m[2]);}else sem.push(d.t);
      if(d.g)pg+=d.g*q;else if(d.m)sem.push(d.t+' (peso)');});
    var n1=function(x){return (Math.round(x*10)/10).toString().replace('.',',');};
    if(pa||pg){L.push('','*Dados para o frete*');
    if(pa)L.push('Pacote (A x L x C): '+n1(pa+0.5)+' x '+n1(pl+0.5)+' x '+n1(pc+0.5)+' cm'+(sem.length?' (parcial)':''));
    if(pg)L.push('Peso dos livros: '+pg+' g ('+n1(pg/1000)+' kg)'+(sem.length?' (parcial)':''));
    if(sem.length)L.push('Sem medidas/peso no site: '+sem.join('; '));}
    L.push('','Quero confirmar o pedido e receber a chave Pix para pagamento.');
    var url='https://wa.me/'+WA+'?text='+encodeURIComponent(L.join('\n'));
    $('co-go').href=url; $('co-done').hidden=false; window.location.href=url;
  });
  render();
})();
</script>
